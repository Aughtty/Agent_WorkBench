[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-workbench-agent"
version = "0.3.0"
description = "面向个人知识、文件和待办的单 Agent 多工具工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "scikit-learn>=1.5,<2",
    "numpy>=2,<3",
    "jsonschema>=4.23,<5",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "fastembed>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1"]
ui = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
